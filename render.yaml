# Render Blueprint — one-click backend deploy
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: apms-api
    runtime: node
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false  # Set to your deployed APMS origin
      - key: APMS_BOOTSTRAP_ADMIN
        value: "true"
      - key: SUPER_ADMIN_USERNAME
        sync: false  # Only needed when provisioning the first admin
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
